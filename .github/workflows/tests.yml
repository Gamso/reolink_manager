name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: pytest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements_test.txt flake8

      - name: Lint (flake8, see setup.cfg)
        run: flake8 custom_components tests

      - name: Run tests
        run: pytest tests/ -v --tb=short
